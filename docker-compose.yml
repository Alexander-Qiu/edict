version: '3.8'

services:
  sansheng-demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: cft0808/sansheng-demo:latest
    platform: linux/amd64
    
    ports:
      - "8989:8989"
    
    environment:
      - DEMO_MODE=true
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0,1
    
    # 挂载 /mnt/data 数据盘和 OpenClaw 配置
    volumes:
      - /mnt/data:/mnt/data:rw
      - ~/.openclaw:/root/.openclaw:rw
    
    # GPU 配置 - 使用两张 A100
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    
    restart: unless-stopped

# 使用说明:
# 1. 确保已安装 NVIDIA Container Toolkit
# 2. 启动: docker compose up -d
# 3. 验证 GPU: docker exec -it <container_id> nvidia-smi
# 4. 访问: http://localhost:8989
