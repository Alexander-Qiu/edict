# ═══════════════════════════════════════════════════════════════
# 三省六部 · Edict Dashboard Nginx 配置
# 作用：反向代理 + 基础认证 + HTTPS 支持（可选）
# ═══════════════════════════════════════════════════════════════

server {
    # 监听端口（HTTP）
    listen 80;
    
    # 如果你有域名，修改这里
    # server_name your-domain.com;
    server_name _;  # 接受任意域名/IP访问
    
    # 客户端 body 大小限制（用于上传等）
    client_max_body_size 50M;
    
    # 超时设置
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ═══════════════════════════════════════════════════════════
    # 基础认证配置
    # ═══════════════════════════════════════════════════════════
    auth_basic "Edict Dashboard - 请输入密码";
    auth_basic_user_file /etc/nginx/.htpasswd_edict;

    # ═══════════════════════════════════════════════════════════
    # 反向代理到 Edict 看板服务
    # ═══════════════════════════════════════════════════════════
    location / {
        proxy_pass http://127.0.0.1:8989;
        proxy_http_version 1.1;
        
        # WebSocket 支持（如果需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 传递真实客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 缓冲设置
        proxy_buffering off;
        proxy_cache off;
    }
    
    # API 路径（可选：单独配置更严格的限流）
    location /api/ {
        proxy_pass http://127.0.0.1:8989/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        
        # 可选：API 限流（每秒 10 请求，突发 20）
        # limit_req zone=api_limit burst=20 nodelay;
    }
    
    # 健康检查路径（可选：免认证，用于监控）
    location /healthz {
        proxy_pass http://127.0.0.1:8989/healthz;
        auth_basic off;  # 健康检查免认证
    }
}

